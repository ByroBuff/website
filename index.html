	<script>

		function toHtml(project_json) {
			const project = document.createElement('div');
			project.classList.add('project');

			const name = document.createElement('span');
			name.classList.add('project_name');

			const link = document.createElement('a');
			link.classList.add('formatted_link');
			link.setAttribute('href', project_json.link);
			link.setAttribute('target', '_blank');
			link.textContent = project_json.name;

			name.appendChild(link);

			const description = document.createElement('span');
			description.classList.add('project_description');
			description.textContent = project_json.description;

			project.appendChild(name);
			project.appendChild(description);

			project.addEventListener('mouseenter', () => {
				const description = project.querySelector('.project_description');
				description.classList.add('highlight');
			});
			project.addEventListener('mouseleave', () => {
				const description = project.querySelector('.project_description');
				description.classList.remove('highlight');
			});

			return project;
		}

		const projects = document.querySelectorAll('.project');

		fetch("projects.json")
			.then(response => response.json())
			.then(data => {
				const projectContainer = document.querySelector('.project_container ul');
				data.forEach(project_json => {
					const projectElement = toHtml(project_json);
					const listItem = document.createElement('li');
					listItem.appendChild(projectElement);
					projectContainer.appendChild(listItem);
				});
			})
			.catch(error => console.error('Error fetching projects:', error));

		projects.forEach((project, index) => {
			if (index !== projects.length - 1) {
				project.style.borderBottom = '1px solid #ccc';
			}
		});

		function setTheme(theme) {
			const body = document.body;
			body.classList.remove('dark', 'light');
			body.classList.add(theme);
			localStorage.setItem('theme', theme);
		}

		function toggleTheme() {
			const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
			const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
			setTheme(newTheme);
		}

		function getSystemTheme() {
			const darkThemeMq = window.matchMedia("(prefers-color-scheme: dark)");
			return darkThemeMq.matches ? 'dark' : 'light';
		}

		function getThemeFromStorage() {
			return localStorage.getItem('theme');
		}

		document.addEventListener('DOMContentLoaded', () => {
			const storedTheme = getThemeFromStorage();
			if (storedTheme) {
				setTheme(storedTheme);
			} else {
				setTheme('light');
			}
		});

		function updateDateTime() {
			const now = new Date();
			// YYYY-MM-DD HH:mm:ss
			const options = {
				year: 'numeric',
				month: '2-digit',
				day: '2-digit',
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit',
				hour12: false
			};
			const formattedDate = now.toLocaleDateString(undefined, options);
			document.getElementById('date').textContent = formattedDate;
		}

		updateDateTime();
		setInterval(updateDateTime, 1000);

		function openVimCommand() {
			const vimContainer = document.querySelector('.vim-container');
			const vimInput = document.getElementById('vim-input');
			vimContainer.style.display = 'block';
			vimInput.focus();
		}

		function closeVimCommand() {
			const vimContainer = document.querySelector('.vim-container');
			const vimInput = document.getElementById('vim-input');
			vimInput.value = '';
			vimContainer.style.display = 'none';
		}

		const vimInput = document.getElementById('vim-input');
		vimInput.addEventListener('keydown', (event) => {
			if (event.key === 'Enter') {
				const command = vimInput.value.trim();
				if (command === 'q') {
					window.close();
				}
				if (command === 'dark') {
					setTheme('dark');
				}

				if (command === 'light') {
					setTheme('light');
				}
				console.log(command);
				closeVimCommand();
			}

			if (event.key === 'Escape') {
				closeVimCommand();
			}
		});

		document.addEventListener('keydown', (event) => {
			if (event.key === ':') {
				event.preventDefault();
				openVimCommand();
			}
		});
	</script>
